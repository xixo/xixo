name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Publish a package without cutting a release, or refresh the release pull requests
        required: true
        type: choice
        options: [release-please, client]

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push' || inputs.package == 'release-please'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      client: ${{ steps.release.outputs['web--release_created'] }}
      client_tag: ${{ steps.release.outputs['web--tag_name'] }}
      server: ${{ steps.release.outputs.release_created }}
      server_tag: ${{ steps.release.outputs.tag_name }}
      server_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Maintain the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  client:
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.client == 'true' || inputs.package == 'client')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.client_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Trusted publishing needs a newer npm than the runner ships
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # The schema is dumped from the Ruby app and the operations are generated
      # against it, so the package cannot be built from the checkout alone.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate the API layer
        run: |
          bin/rails graphql:dump_schema
          npm run codegen
          npm run build:sdk

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Publish
        working-directory: web
        run: npm publish --access public

  server:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive the version tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
