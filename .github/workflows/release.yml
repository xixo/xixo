name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Publish a package without cutting a release, or refresh the release pull requests
        required: true
        type: choice
        options: [release-please, client]

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push' || inputs.package == 'release-please'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      client: ${{ steps.release.outputs['web--release_created'] }}
      client_tag: ${{ steps.release.outputs['web--tag_name'] }}
      server: ${{ steps.release.outputs.release_created }}
      server_tag: ${{ steps.release.outputs.tag_name }}
      server_version: ${{ steps.release.outputs.version }}

    steps:
      - name: Maintain the release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  client:
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.client == 'true' || inputs.package == 'client')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.client_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Trusted publishing needs a newer npm than the runner ships
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      # The schema is dumped from the Ruby app and the operations are generated
      # against it, so the package cannot be built from the checkout alone.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate the API layer
        run: |
          bin/rails graphql:dump_schema
          npm run codegen
          npm run build:sdk

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Publish
        working-directory: web
        run: npm publish --access public

  mac_reader:
    needs: release-please
    if: needs.release-please.outputs.server == 'true'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}

      - name: Build the mac reader for Apple silicon and Intel
        run: |
          make -C link/macos
          lipo link/macos/build/xixo-mac-reader -verify_arch arm64 x86_64
          cd link/macos/build && shasum -a 256 xixo-mac-reader > xixo-mac-reader.sha256

      - name: Attach it and its SHA-256 to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.server_tag }}
        run: gh release upload "$TAG" link/macos/build/xixo-mac-reader link/macos/build/xixo-mac-reader.sha256 --clobber

      - name: Hand it to the image build
        uses: actions/upload-artifact@v4
        with:
          name: mac-reader
          path: link/macos/build/xixo-mac-reader
          if-no-files-found: error

  link_release:
    needs: [release-please, mac_reader]
    if: needs.release-please.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: link/go.mod
          cache-dependency-path: link/go.sum

      - name: Fetch the mac reader
        uses: actions/download-artifact@v4
        with:
          name: mac-reader
          path: ${{ runner.temp }}/release/opt/xixo-link/mac

      - name: Build xixo link for every system, with its units and launch agent
        env:
          OUT: ${{ runner.temp }}/release/opt/xixo-link
          VERSION: ${{ needs.release-please.outputs.server_version }}
        working-directory: link
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=$VERSION" -o "$OUT/xixo-link-$os-$arch" .
            done
          done
          cp xixo-link.service xixo-link-update.service xixo-link-update.path \
            xixo-link-part@.service xixo-link-part@.path xixo-link.plist "$OUT/"
          printf '%s\n' "$VERSION" > "$OUT/version"
          go run ./cmd/link-release --dir "$OUT" --version "$VERSION" --revision "$GITHUB_SHA" \
            --serial "$(git rev-list --count HEAD)"

      - name: Sign the release, every file in it together
        id: signed
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ runner.temp }}/release/opt/xixo-link/xixo-link-*
            ${{ runner.temp }}/release/opt/xixo-link/*.service
            ${{ runner.temp }}/release/opt/xixo-link/*.path
            ${{ runner.temp }}/release/opt/xixo-link/xixo-link.plist
            ${{ runner.temp }}/release/opt/xixo-link/mac/xixo-mac-reader
            ${{ runner.temp }}/release/opt/xixo-link/release.json

      - name: Keep the signature beside the release, and attach both to it
        env:
          BUNDLE: ${{ steps.signed.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.server_tag }}
        run: |
          cp "$BUNDLE" "$RUNNER_TEMP/release/opt/xixo-link/release.sigstore.json"
          gh release upload "$TAG" "$RUNNER_TEMP/release/opt/xixo-link/release.json" \
            "$RUNNER_TEMP/release/opt/xixo-link/release.sigstore.json" --clobber

      - name: Hand the release to the image build
        uses: actions/upload-artifact@v4
        with:
          name: link-release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  server:
    needs: [release-please, mac_reader, link_release]
    if: needs.release-please.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag }}

      - name: Fetch the mac reader the image serves
        uses: actions/download-artifact@v4
        with:
          name: mac-reader
          path: ${{ runner.temp }}/mac-reader

      - name: Fetch the signed xixo link release the image serves
        uses: actions/download-artifact@v4
        with:
          name: link-release
          path: ${{ runner.temp }}/link-release

      - name: Set up QEMU, for the link's arm64 image
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive the version tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the release image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: |
            mac-reader=${{ runner.temp }}/mac-reader
            link-release=${{ runner.temp }}/link-release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Attest what built the image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Derive the link's version tags
        id: link
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-link
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}

      - name: Build and push the link's release image
        id: link_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.link
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.link.outputs.tags }}
          labels: ${{ steps.link.outputs.labels }}
          cache-from: type=gha,scope=link

      - name: Attest what built the link image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-link
          subject-digest: ${{ steps.link_image.outputs.digest }}
          push-to-registry: true

      - name: Derive the updater's version tags
        id: updater
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-updater
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.server_version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.server_version }}

      - name: Build and push the updater's release image
        id: updater_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.updater.outputs.tags }}
          labels: ${{ steps.updater.outputs.labels }}
          cache-from: type=gha,scope=updater

      - name: Attest what built the updater image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-updater
          subject-digest: ${{ steps.updater_image.outputs.digest }}
          push-to-registry: true
