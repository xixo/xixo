name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: xixo
  DOCS_DOMAIN: docs.xixo.network

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Create the Pages project the first time
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if out=$(npx --yes wrangler@3 pages project create "$PAGES_PROJECT" \
                     --production-branch=main 2>&1); then
            echo "$out"
            exit 0
          fi

          echo "$out"
          echo "$out" | grep -qiE 'already (exists|in use)|8000009' || exit 1
          echo "$PAGES_PROJECT already exists — nothing to create."

      - name: Find the pages.dev address Cloudflare gave the project
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          subdomain=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" \
            | jq -r '.result.subdomain')
          if [ -z "$subdomain" ] || [ "$subdomain" = null ]; then
            echo "no subdomain for $PAGES_PROJECT"
            exit 1
          fi
          echo "subdomain=$subdomain" >> "$GITHUB_OUTPUT"

      - name: Name the deploy after the branch it came from
        id: target
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          slug=$(echo "$BRANCH" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9]/-/g' -e 's/^-*//' -e 's/-*$//' \
            | cut -c1-28 | sed -e 's/-*$//')
          echo "branch=$slug" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_name }}" = "main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "site=https://$DOCS_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "site=https://$slug.${{ steps.pages.outputs.subdomain }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Build
        working-directory: docs
        env:
          DOCS_SITE: ${{ steps.target.outputs.site }}
        run: npm run build

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: >-
            pages deploy dist
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=${{ steps.target.outputs.branch }}
            --commit-dirty=true

      - name: Report where it landed
        run: |
          {
            echo "### Docs deployed"
            echo
            echo "- canonical: ${{ steps.target.outputs.site }}"
            echo "- this deploy: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
