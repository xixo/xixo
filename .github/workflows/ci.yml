name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: YAML and Markdown
        run: |
          npx --yes prettier --check --no-error-on-unmatched-pattern \
            "*.{yml,yaml,md}" ".github/**/*.{yml,yaml}" "config/**/*.{yml,yaml}"

      - name: Shell
        run: |
          scripts=()
          while IFS= read -r s; do scripts+=("$s"); done < <(shfmt -f bin script)
          shfmt -d -i 2 -ci "${scripts[@]}"
          shellcheck "${scripts[@]}"

  actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  boot:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Eager load the way production does
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE: boot_check_secret_key_base_not_for_deployments
          ENCRYPTION_PRIMARY_KEY: boot_check_primary_key_not_for_credentials
          ENCRYPTION_DETERMINISTIC_KEY: boot_check_deterministic_key_not_real
          ENCRYPTION_KEY_DERIVATION_SALT: boot_check_key_derivation_salt_fake
          URIS_PUBLIC_ORIGIN: https://%{subdomain}.uris.example
        run: bin/rails zeitwerk:check

  scan_ruby:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate the API layer
        run: |
          bin/rails graphql:dump_schema
          npm run codegen
          npm run build:sdk

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  reference:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: The generated reference pages still match the code
        env:
          RAILS_ENV: test
        run: |
          bin/rails docs:reference
          git diff --exit-code -- docs ||
            {
              echo "::error::The reference pages are stale. Run ./dev reference and commit."
              exit 1
            }

  test:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, server, corpus, client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: ${{ matrix.suite }}, in the container it ships in
        env:
          MASKS_CLIENT_DIR: ./compose/masks-client
        run: ./dev test ${{ matrix.suite }}

  image:
    needs: [test, boot, scan_ruby, reference]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
