name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          chmod +x /usr/local/bin/shfmt

      - name: YAML and Markdown
        run: |
          npx --yes prettier --check --no-error-on-unmatched-pattern \
            "*.{yml,yaml,md}" ".github/**/*.{yml,yaml}" "config/**/*.{yml,yaml}"

      - name: Shell
        run: |
          scripts=()
          while IFS= read -r s; do scripts+=("$s"); done < <(shfmt -f bin script)
          shfmt -d -i 2 -ci "${scripts[@]}"
          shellcheck "${scripts[@]}"

  actions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  link:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: link

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: link/go.mod
          cache-dependency-path: link/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Build for Linux
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/xixo-link-linux-$arch" .
          done

  mac_reader:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: link

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: link/go.mod
          cache-dependency-path: link/go.sum

      - name: Build the mac reader for Apple silicon and Intel
        run: |
          make -C macos
          lipo macos/build/xixo-mac-reader -verify_arch arm64 x86_64

      - name: Test extraction with the mac reader under the sandbox
        run: go test ./internal/extract/...

      - name: Build for macOS
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -o "/tmp/xixo-link-darwin-$arch" .
          done

      - name: Hand the mac reader to the image build
        uses: actions/upload-artifact@v4
        with:
          name: mac-reader
          path: link/macos/build/xixo-mac-reader
          if-no-files-found: error

  boot:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - auth: embedded
            issuer: ""
          - auth: separate
            issuer: https://%{subdomain}.auth.example

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Eager load the way production does, with ${{ matrix.auth }} masks
        env:
          MASKS_ISSUER_TEMPLATE: ${{ matrix.issuer }}
          RAILS_ENV: production
          SECRET_KEY_BASE: boot_check_secret_key_base_not_for_deployments
          ENCRYPTION_PRIMARY_KEY: boot_check_primary_key_not_for_credentials
          ENCRYPTION_DETERMINISTIC_KEY: boot_check_deterministic_key_not_real
          ENCRYPTION_KEY_DERIVATION_SALT: boot_check_key_derivation_salt_fake
          XIXO_PUBLIC_ORIGIN: https://%{subdomain}.xixo.example
        run: bin/rails zeitwerk:check

  scan_ruby:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  lint_js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Generate the API layer
        run: |
          bin/rails graphql:dump_schema
          npm run codegen
          npm run build:sdk

      - name: Lint and format
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  reference:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: The generated reference pages still match the code
        env:
          RAILS_ENV: test
        run: |
          bin/rails docs:reference
          git diff --exit-code -- docs ||
            {
              echo "::error::The reference pages are stale. Run ./dev reference and commit."
              exit 1
            }

  test:
    needs: [format, actions, lint, lint_js]
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, server, embedded, corpus, client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: ${{ matrix.suite }}, in the container it ships in
        env:
          MASKS_CLIENT_DIR: ./compose/masks-client
          MASKS_SERVER_DIR: ./compose/masks-server
        run: ./dev test ${{ matrix.suite }}

  image:
    needs: [test, boot, scan_ruby, reference, mac_reader]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Fetch the mac reader the image serves
        uses: actions/download-artifact@v4
        with:
          name: mac-reader
          path: ${{ runner.temp }}/mac-reader

      - name: Set up QEMU, for the link's arm64 image
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Derive the image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the production image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: mac-reader=${{ runner.temp }}/mac-reader
          build-args: XIXO_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest what built the image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Derive the link image tags
        id: link
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-link
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the link image
        id: link_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.link
          build-args: XIXO_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.link.outputs.tags }}
          labels: ${{ steps.link.outputs.labels }}
          cache-from: type=gha,scope=link
          cache-to: type=gha,mode=max,scope=link

      - name: Attest what built the link image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-link
          subject-digest: ${{ steps.link_image.outputs.digest }}
          push-to-registry: true

      - name: Derive the updater image tags
        id: updater
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-updater
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build the updater image
        id: updater_image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.updater
          build-args: XIXO_COMMIT=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.updater.outputs.tags }}
          labels: ${{ steps.updater.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

      - name: Attest what built the updater image
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}-updater
          subject-digest: ${{ steps.updater_image.outputs.digest }}
          push-to-registry: true
