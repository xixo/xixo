shared: &shared
  schedule_syncs:
    class: ScheduleSyncsJob
    queue: sync
    schedule: every minute

  schedule_checks:
    class: ScheduleChecksJob
    queue: sync
    schedule: every 10 minutes

  schedule_feeds:
    class: ScheduleFeedsJob
    queue: sync
    schedule: every minute
  embed_items:
    class: EmbedItemsJob
    queue: analysis
    schedule: every minute

  digest_references:
    class: DigestReferencesJob
    queue: analysis
    schedule: every minute

  sweep_audit_events:
    class: SweepAuditEventsJob
    queue: sync
    schedule: every day at 4am
  expire_overdue:
    class: ExpireOverdueJob
    queue: sync
    schedule: every 10 minutes

  forget_expired:
    class: ForgetExpiredJob
    queue: sync
    schedule: every hour at minute 37

  forget_gone:
    class: ForgetGoneJob
    queue: sync
    schedule: every day at 4:50am

  sweep_runs:
    class: SweepRunsJob
    queue: sync
    schedule: every day at 4:20am

  forget_lonely_facets:
    class: ForgetLonelyFacetsJob
    queue: sync
    schedule: every day at 4:40am

  rebuild_search_index:
    class: RebuildSearchIndexJob
    queue: sync
    schedule: every 10 minutes

development:
  <<: *shared

test: {}

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
