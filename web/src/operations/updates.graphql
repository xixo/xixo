query ServerUpdates {
  serverUpdates {
    manual
    channel
    paused
    checkedAt
    images {
      name
      current
      previous
      created
      revision
      version
      target
      containers {
        name
        service
        state
        health
        stale
      }
    }
    events {
      at
      action
      kind
      digest
      error
      by
      channel
    }
  }
}

mutation RequestServerUpdate($action: String!, $channel: String) {
  requestServerUpdate(input: { action: $action, channel: $channel }) {
    serverUpdates {
      manual
    }
  }
}

query LinkUpdates {
  administrator
  linkUpdates {
    release
    protocol
    rollout {
      release
      version
      serial
      phase
      startedAt
      phaseAt
      heldReason
      serverHealthyFor
      firstHealthyFor
      firstMachines {
        os
        arrivedAt
        picked
        resource {
          id
          key
          name
        }
      }
    }
    machines {
      id
      key
      name
      machine {
        hostname
        os
        version
        release
        serial
        protocol
        current
        updates
        updatesItself
        connected
        seenAt
        updateState
        lastUpdatedAt
        lastRollback
        lastRollbackAt
      }
    }
  }
}

mutation RequestMachineUpdate($id: ID, $action: String!) {
  requestMachineUpdate(input: { id: $id, action: $action }) {
    linkUpdates {
      protocol
    }
  }
}
