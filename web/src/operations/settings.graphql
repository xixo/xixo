query Settings {
  settings {
    key
    level
    value
    defaultValue
    allowed
    label
    note
    unit
  }
}

mutation SetSetting($key: String!, $value: String!) {
  setSetting(input: { key: $key, value: $value }) {
    setting {
      key
      value
    }
  }
}

query Setup {
  setup {
    storage
    inference
    client
    storageResource {
      ...SetupResource
    }
    inferenceResource {
      ...SetupResource
    }
    connectedClient {
      name
      person
      at
    }
  }
}

fragment SetupResource on SetupResource {
  id
  key
  name
  kind
  model
  down
}
