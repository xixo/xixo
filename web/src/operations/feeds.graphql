query Feeds {
  feeds(type: "uris:feed", limit: 200) {
    nodes {
      id
      key
      title
      type
      connectedCount
      schedule {
        id
        prompt
        interval
        scheduled
        pausedAt
        nextRunAt
        ranAt
      }
    }
  }
}

query FeedSchedule($key: String!) {
  feed(key: $key) {
    id
    key
    title
    timeout
    type
    connectedCount
    analyses {
      id
      cause
      status
      error
      said
      turns
      createdAt
      startedAt
      finishedAt
    }
    schedule {
      id
      prompt
      turns
      interval
      scheduled
      pausedAt
      nextRunAt
      ranAt
    }
  }
}

mutation SaveFeed(
  $id: ID
  $key: String
  $title: String
  $prompt: String
  $interval: Int
  $turns: Int
  $timeout: Int
) {
  saveFeed(
    input: {
      id: $id
      key: $key
      title: $title
      prompt: $prompt
      interval: $interval
      turns: $turns
      timeout: $timeout
    }
  ) {
    feed {
      id
      key
      title
      connectedCount
      schedule {
        id
        prompt
        interval
        scheduled
        nextRunAt
      }
    }
  }
}

mutation RunFeed($id: ID!) {
  runFeed(input: { id: $id }) {
    analysis {
      id
      status
    }
  }
}

mutation PauseFeed($id: ID!, $paused: Boolean!) {
  pauseFeed(input: { id: $id, paused: $paused }) {
    feed {
      id
      schedule {
        id
        pausedAt
        scheduled
        nextRunAt
      }
    }
  }
}

subscription AnalysisProgressed($id: ID) {
  analysisProgressed(id: $id) {
    analysis {
      id
      status
      error
      turns
      steps
      lines
      logs
      finishedAt
      durationMs
    }
  }
}

mutation DeleteFeed($id: ID!) {
  deleteFeed(input: { id: $id }) {
    deleted
    kept
  }
}

mutation CancelAnalysis($id: ID!) {
  cancelAnalysis(input: { id: $id }) {
    cancelled
    analysis {
      id
      status
    }
  }
}

mutation TagFeeds($ids: [ID!]!, $tag: String!) {
  tagFeeds(input: { ids: $ids, tag: $tag }) {
    feeds {
      id
    }
  }
}
