query Resources($archived: Boolean) {
  resources(archived: $archived) {
    id
    type
    key
    name
    capabilities
    itemsCount
    defaultStorage
    defaultInference
    syncInterval
    nextSyncAt
    syncedAt
    syncing
    syncable
    checkedAt
    checkError
    healthy
    archivedAt
    settings
    heldCredentials
    changeable
    personal
    delegated
    needsConnect
    connectedBy
    connectUrl
    via
    routable
  }
}

mutation ArchiveResource($id: ID!, $archived: Boolean!) {
  archiveResource(input: { id: $id, archived: $archived }) {
    resource {
      id
      key
      archivedAt
    }
  }
}

mutation SyncResource($id: ID!) {
  syncResource(input: { id: $id }) {
    run {
      id
      status
    }
    resource {
      id
      syncing
    }
  }
}

mutation CheckResource($id: ID!) {
  checkResource(input: { id: $id }) {
    ok
    resource {
      id
      checkedAt
      checkError
      healthy
    }
  }
}

mutation SetDefaultStorage($id: ID!) {
  setDefaultStorage(input: { id: $id }) {
    resource {
      id
      defaultStorage
    }
  }
}

mutation SetDefaultInference($id: ID!) {
  setDefaultInference(input: { id: $id }) {
    resource {
      id
      defaultInference
    }
  }
}

mutation SetSyncInterval($id: ID!, $seconds: Int) {
  setSyncInterval(input: { id: $id, seconds: $seconds }) {
    resource {
      id
      syncInterval
      nextSyncAt
    }
  }
}

mutation ExportFeeds($destinationId: ID, $type: String, $query: String) {
  exportFeeds(
    input: { destinationId: $destinationId, type: $type, query: $query }
  ) {
    run {
      id
      status
    }
  }
}

query ResourceTypes {
  resourceTypes {
    type
    label
    blurb
    names
    capabilities
    syncs
    delegated
    routable
    fields {
      name
      label
      kind
      required
      secret
      value
      help
      placeholder
      options {
        value
        label
      }
      shownWhen {
        field
        values
      }
    }
  }
}

mutation AttachResource(
  $type: String!
  $key: String!
  $name: String
  $settings: JSON
  $personal: Boolean
  $via: String
) {
  attachResource(
    input: {
      type: $type
      key: $key
      name: $name
      settings: $settings
      personal: $personal
      via: $via
    }
  ) {
    resource {
      id
      type
      key
      name
    }
    checkError
    connectUrl
  }
}

mutation UpdateResource(
  $id: ID!
  $name: String
  $settings: JSON
  $via: String
) {
  updateResource(
    input: { id: $id, name: $name, settings: $settings, via: $via }
  ) {
    resource {
      id
      key
      name
      via
    }
    checkError
  }
}
