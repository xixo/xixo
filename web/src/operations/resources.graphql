query Resources($archived: Boolean) {
  administrator
  waitingForMachines {
    kind
    count
  }
  linkUp {
    xixo
    systems
  }
  resources(archived: $archived) {
    id
    type
    key
    name
    capabilities
    itemsCount
    defaultStorage
    defaultInference
    syncInterval
    nextSyncAt
    syncedAt
    syncing
    syncable
    checkedAt
    checkError
    healthy
    checking
    offline
    offlineHost
    offlineLastSeenAt
    emptiedAt
    archivedAt
    settings
    heldCredentials
    changeable
    manageable
    personal
    delegated
    needsConnect
    connectedBy
    connectUrl
    via
    routable
    machineId
    machine {
      hostname
      version
      connected
      seenAt
      uptime
      folders
      extractors
      unread
      access
      helpsOthers
      heldBack
      lends
      tools
      warnings
      os
      arch
      extractsForOthers
      waiting {
        kind
        count
      }
      linked
      services {
        kind
        port
        address
        url
        via
      }
      memoryTotal
      memoryAvailable
      disks {
        path
        total
        free
      }
    }
  }
}

fragment LinkRequestFields on LinkRequest {
  id
  code
  status
  hostname
  os
  arch
  folders
  writable
  remoteIp
  expiresAt
  createdAt
  user
  system
  model
  version
  cpus
  memory
  disks {
    path
    total
    free
  }
  addresses
  services {
    kind
    port
  }
  sameAddress
  linksAs
  namedLike
  machine {
    id
    key
    machine {
      connected
    }
  }
}

query LinkRequests {
  linkRequests {
    ...LinkRequestFields
  }
}

query LinkRequest($code: String!) {
  administrator
  linkRequest(code: $code) {
    ...LinkRequestFields
  }
}

subscription LinkRequestChanged {
  linkRequestChanged {
    request {
      ...LinkRequestFields
    }
  }
}

mutation ApproveLinkRequest($id: ID!) {
  approveLinkRequest(input: { id: $id }) {
    request {
      ...LinkRequestFields
    }
  }
}

mutation DenyLinkRequest($id: ID!) {
  denyLinkRequest(input: { id: $id }) {
    request {
      ...LinkRequestFields
    }
  }
}

mutation SetMachineAccess($id: ID!, $access: String, $helpsOthers: Boolean) {
  setMachineAccess(
    input: { id: $id, access: $access, helpsOthers: $helpsOthers }
  ) {
    resource {
      id
      machine {
        access
        helpsOthers
        heldBack
        lends
        tools
        extractsForOthers
      }
    }
  }
}

query UnlinkedMachines {
  unlinkedMachines {
    hostName
    dnsName
    addresses
    via
    services {
      name
      port
      type
      address
    }
  }
}

subscription MachineChanged($id: ID) {
  machineChanged(id: $id) {
    resource {
      id
      key
      machine {
        hostname
        connected
        linked
        folders
      }
    }
  }
}

mutation ArchiveResource($id: ID!, $archived: Boolean!) {
  archiveResource(input: { id: $id, archived: $archived }) {
    resource {
      id
      key
      archivedAt
    }
  }
}

mutation DeleteResource($id: ID!) {
  deleteResource(input: { id: $id }) {
    deleted
    places
  }
}

mutation SyncResource($id: ID!) {
  syncResource(input: { id: $id }) {
    run {
      id
      status
    }
    resource {
      id
      syncing
    }
  }
}

mutation CheckResource($id: ID!) {
  checkResource(input: { id: $id }) {
    ok
    resource {
      id
      checkedAt
      checkError
      healthy
      checking
      offline
      offlineHost
      offlineLastSeenAt
    }
  }
}

mutation SetDefaultStorage($id: ID!) {
  setDefaultStorage(input: { id: $id }) {
    resource {
      id
      defaultStorage
    }
  }
}

mutation SetDefaultInference($id: ID!) {
  setDefaultInference(input: { id: $id }) {
    resource {
      id
      defaultInference
    }
  }
}

mutation SetSyncInterval($id: ID!, $seconds: Int) {
  setSyncInterval(input: { id: $id, seconds: $seconds }) {
    resource {
      id
      syncInterval
      nextSyncAt
    }
  }
}

mutation ExportFeeds($destinationId: ID, $type: String, $query: String) {
  exportFeeds(
    input: { destinationId: $destinationId, type: $type, query: $query }
  ) {
    run {
      id
      status
    }
  }
}

query Discovered($via: String!, $type: String!) {
  discovered(via: $via) {
    hostName
    dnsName
    addresses
    online
    lastSeenAt
    address(type: $type)
    services {
      name
      port
      type
      address
    }
  }
}

query ResourceTypes {
  resourceTypes {
    type
    label
    blurb
    names
    capabilities
    syncs
    delegated
    routable
    addressedBy
    fields {
      name
      label
      kind
      required
      secret
      value
      help
      placeholder
      options {
        value
        label
      }
      shownWhen {
        field
        values
      }
    }
  }
}

mutation AttachResource(
  $type: String!
  $key: String!
  $name: String
  $settings: JSON
  $personal: Boolean
  $via: String
) {
  attachResource(
    input: {
      type: $type
      key: $key
      name: $name
      settings: $settings
      personal: $personal
      via: $via
    }
  ) {
    resource {
      id
      type
      key
      name
    }
    checkError
    connectUrl
  }
}

mutation UpdateResource(
  $id: ID!
  $name: String
  $settings: JSON
  $via: String
) {
  updateResource(
    input: { id: $id, name: $name, settings: $settings, via: $via }
  ) {
    resource {
      id
      key
      name
      via
    }
    checkError
  }
}
