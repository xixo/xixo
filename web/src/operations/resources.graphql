query Resources($archived: Boolean) {
  administrator
  waitingForMachines {
    kind
    count
  }
  linkUp {
    xixo
    systems
  }
  resources(archived: $archived) {
    id
    type
    key
    name
    capabilities
    itemsCount
    defaultStorage
    defaultInference
    syncInterval
    nextSyncAt
    syncedAt
    syncing
    syncable
    checkedAt
    checkError
    sight
    healthy
    checking
    offline
    offlineHost
    offlineLastSeenAt
    emptiedAt
    archivedAt
    settings
    heldCredentials
    changeable
    manageable
    personal
    forOperators
    delegated
    needsConnect
    connectedBy
    connectUrl
    via
    routable
    machineId
    movable
    machine {
      hostname
      os
      system
      model
      kind
      version
      release
      current
      updates
      updatesItself
      connected
      seenAt
      uptime
      folders
      writable
      extractors
      unread
      heldBack
      lends
      tools
      warnings
      os
      arch
      battery
      gpus {
        maker
        model
        memory
        driver
      }
      plan {
        key
        says
        why
        on
        possible
      }
      waiting {
        kind
        count
      }
      linked
      services {
        kind
        port
      }
      parts {
        name
        version
        state
        port
        warning
        pulls {
          model
          done
          total
          ready
          error
        }
      }
      memoryTotal
      memoryAvailable
      disks {
        path
        total
        free
      }
    }
  }
}

fragment LinkRequestFields on LinkRequest {
  id
  code
  status
  hostname
  os
  arch
  folders
  writable
  remoteIp
  expiresAt
  createdAt
  user
  system
  model
  kind
  battery
  version
  cpus
  memory
  gpus {
    maker
    model
    memory
    driver
  }
  readers
  plan {
    key
    says
    why
    on
    possible
  }
  disks {
    path
    total
    free
  }
  addresses
  services {
    kind
    port
  }
  sameAddress
  linksAs
  namedLike
  machine {
    id
    key
    machine {
      connected
    }
  }
}

query LinkRequests {
  linkRequests {
    ...LinkRequestFields
  }
}

query LinkRequest($code: String!) {
  administrator
  linkRequest(code: $code) {
    ...LinkRequestFields
  }
}

subscription LinkRequestChanged {
  linkRequestChanged {
    request {
      ...LinkRequestFields
    }
  }
}

mutation ApproveLinkRequest($id: ID!, $off: [String!]) {
  approveLinkRequest(input: { id: $id, off: $off }) {
    request {
      ...LinkRequestFields
    }
  }
}

mutation DenyLinkRequest($id: ID!) {
  denyLinkRequest(input: { id: $id }) {
    request {
      ...LinkRequestFields
    }
  }
}

mutation SetMachinePlan($id: ID!, $key: String!, $on: Boolean!) {
  setMachinePlan(input: { id: $id, key: $key, on: $on }) {
    resource {
      id
      machine {
        plan {
          key
          says
          why
          on
          possible
        }
        tools
      }
    }
  }
}

mutation SetFolderForEveryone($id: ID!, $everyone: Boolean!) {
  setFolderForEveryone(input: { id: $id, everyone: $everyone }) {
    resource {
      id
      forOperators
      manageable
    }
  }
}

mutation SetMachineUpdates($id: ID!, $automatic: Boolean!) {
  setMachineUpdates(input: { id: $id, automatic: $automatic }) {
    resource {
      id
      machine {
        updates
        current
      }
    }
  }
}

query UnlinkedMachines {
  unlinkedMachines {
    hostName
    dnsName
    addresses
    via
    services {
      name
      port
      type
      address
    }
  }
}

subscription MachineChanged($id: ID) {
  machineChanged(id: $id) {
    resource {
      id
      key
      machine {
        hostname
        connected
        linked
        folders
      }
    }
  }
}

mutation ArchiveResource($id: ID!, $archived: Boolean!) {
  archiveResource(input: { id: $id, archived: $archived }) {
    resource {
      id
      key
      archivedAt
    }
  }
}

mutation DeleteResource($id: ID!) {
  deleteResource(input: { id: $id }) {
    deleted
    places
  }
}

mutation SyncResource($id: ID!) {
  syncResource(input: { id: $id }) {
    run {
      id
      status
    }
    resource {
      id
      syncing
    }
  }
}

mutation CheckResource($id: ID!) {
  checkResource(input: { id: $id }) {
    ok
    resource {
      id
      checkedAt
      checkError
      sight
      healthy
      checking
      offline
      offlineHost
      offlineLastSeenAt
    }
  }
}

mutation SetDefaultStorage($id: ID!) {
  setDefaultStorage(input: { id: $id }) {
    resource {
      id
      defaultStorage
    }
  }
}

mutation SetDefaultInference($id: ID!) {
  setDefaultInference(input: { id: $id }) {
    resource {
      id
      defaultInference
    }
  }
}

mutation SetSyncInterval($id: ID!, $seconds: Int) {
  setSyncInterval(input: { id: $id, seconds: $seconds }) {
    resource {
      id
      syncInterval
      nextSyncAt
    }
  }
}

mutation ExportFeeds($destinationId: ID, $type: String, $query: String) {
  exportFeeds(
    input: { destinationId: $destinationId, type: $type, query: $query }
  ) {
    run {
      id
      status
    }
  }
}

mutation MoveFiles(
  $destinationId: ID!
  $into: String
  $sourceId: ID
  $path: String
  $feedIds: [ID!]
  $query: String
  $type: String
) {
  moveFiles(
    input: {
      destinationId: $destinationId
      into: $into
      sourceId: $sourceId
      path: $path
      feedIds: $feedIds
      query: $query
      type: $type
    }
  ) {
    run {
      id
      status
    }
  }
}

query Discovered($via: String!, $type: String!) {
  discovered(via: $via) {
    hostName
    dnsName
    addresses
    online
    lastSeenAt
    address(type: $type)
    services {
      name
      port
      type
      address
    }
  }
}

query ResourceTypes {
  resourceTypes {
    type
    label
    blurb
    names
    capabilities
    syncs
    delegated
    routable
    addressedBy
    fields {
      name
      label
      kind
      required
      secret
      value
      help
      placeholder
      options {
        value
        label
      }
      shownWhen {
        field
        values
      }
    }
  }
}

mutation AttachResource(
  $type: String!
  $key: String!
  $name: String
  $settings: JSON
  $personal: Boolean
  $via: String
) {
  attachResource(
    input: {
      type: $type
      key: $key
      name: $name
      settings: $settings
      personal: $personal
      via: $via
    }
  ) {
    resource {
      id
      type
      key
      name
    }
    checkError
    connectUrl
  }
}

mutation UpdateResource(
  $id: ID!
  $name: String
  $settings: JSON
  $via: String
) {
  updateResource(
    input: { id: $id, name: $name, settings: $settings, via: $via }
  ) {
    resource {
      id
      key
      name
      via
    }
    checkError
  }
}
