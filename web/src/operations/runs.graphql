fragment MoveProgressFields on MoveProgress {
  files
  filesDone
  filesFailed
  bytes
  bytesDone
}

query Runs($status: String, $resourceId: ID, $after: ID, $limit: Int) {
  runs(status: $status, resourceId: $resourceId, after: $after, limit: $limit) {
    hasMore
    nextCursor
    nodes {
      id
      kind
      status
      processed
      lines
      error
      moved {
        ...MoveProgressFields
      }
      startedAt
      finishedAt
      createdAt
      resource {
        id
        key
      }
    }
  }
}

query RunLog($id: ID!) {
  run(id: $id) {
    id
    status
    lines
    logs
  }
}

subscription RunProgressed {
  runProgressed {
    run {
      id
      status
      processed
      error
      moved {
        ...MoveProgressFields
      }
      startedAt
      finishedAt
    }
  }
}

query MoveRun($id: ID!) {
  run(id: $id) {
    id
    status
    error
    moved {
      ...MoveProgressFields
    }
  }
}

subscription MoveProgressed($id: ID!) {
  runProgressed(id: $id) {
    run {
      id
      status
      error
      moved {
        ...MoveProgressFields
      }
    }
  }
}

subscription RunLogged($id: ID!) {
  runProgressed(id: $id) {
    run {
      id
      logs
    }
  }
}

mutation CancelRun($id: ID!) {
  cancelRun(input: { id: $id }) {
    cancelled
    run {
      id
      status
    }
  }
}
