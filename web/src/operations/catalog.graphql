fragment Row on Feed {
  id
  type
  key
  title
  mime
  summary
  thumbnailUrl
  staged
  analyzedAt
  unsummarized
  createdAt
  parent {
    id
    title
    key
  }
}

query Catalog(
  $types: [String!]
  $connectedTo: ID
  $topLevel: Boolean
  $machineId: ID
  $resourceId: ID
  $analysis: String
  $kind: String
  $since: ISO8601DateTime
  $after: ID
  $limit: Int
) {
  tenant {
    id
    name
    subdomain
  }
  feeds(
    types: $types
    connectedTo: $connectedTo
    topLevel: $topLevel
    slice: {
      machineId: $machineId
      resourceId: $resourceId
      analysis: $analysis
      kind: $kind
      since: $since
    }
    after: $after
    limit: $limit
  ) {
    hasMore
    nextCursor
    total
    nodes {
      ...Row
    }
  }
}

query Types {
  types {
    type
    count
  }
}

query Search(
  $query: String
  $types: [String!]
  $machineId: ID
  $resourceId: ID
  $analysis: String
  $kind: String
  $since: ISO8601DateTime
  $after: ID
  $limit: Int
) {
  search(
    query: $query
    types: $types
    slice: {
      machineId: $machineId
      resourceId: $resourceId
      analysis: $analysis
      kind: $kind
      since: $since
    }
    after: $after
    limit: $limit
  ) {
    hasMore
    nextCursor
    total
    nodes {
      ...Row
    }
  }
}

query SliceCounts(
  $query: String
  $types: [String!]
  $connectedTo: ID
  $topLevel: Boolean
  $machineId: ID
  $resourceId: ID
  $analysis: String
  $kind: String
  $since: ISO8601DateTime
) {
  sliceCounts(
    query: $query
    types: $types
    connectedTo: $connectedTo
    topLevel: $topLevel
    slice: {
      machineId: $machineId
      resourceId: $resourceId
      analysis: $analysis
      kind: $kind
      since: $since
    }
  ) {
    where {
      key
      count
    }
    analysis {
      key
      count
    }
    kind {
      key
      count
    }
    when {
      key
      count
    }
  }
}

query Places {
  resources {
    id
    type
    key
    name
    machineId
  }
}

fragment Pass on Analysis {
  id
  cause
  question
  drewOn {
    id
  }
  status
  error
  waiting
  said
  steps
  lines
  createdAt
  startedAt
  finishedAt
  durationMs
}

query FeedDetail($id: ID!) {
  feed(id: $id) {
    ...Row
    asked
    note
    unsummarized
    expiresAt
    details {
      group
      step
      item
      label
      value
    }
    connectedCount
    parent {
      id
      type
      key
      title
    }
    children {
      ...Row
    }
    thread {
      ...Row
    }
    tags {
      ...Row
    }
    mimes {
      ...Row
    }
    references {
      id
      role
      locatorKey
      filename
      contentType
      size
      contentUrl
      thumbnailUrl
      hiresUrl
      analyzedAt
      goneAt
      digest
      resource {
        id
        key
        type
      }
    }
    analyses {
      ...Pass
    }
  }
}

query AnalysisLog($id: ID!) {
  analysis(id: $id) {
    id
    status
    lines
    logs
  }
}

subscription FeedAnalyzed {
  feedAnalyzed {
    feed {
      id
      type
      title
    }
  }
}

mutation AnalyzeFeed($id: ID!) {
  analyzeFeed(input: { id: $id }) {
    analysis {
      id
      status
    }
  }
}

mutation SplitReference($id: ID!) {
  splitReference(input: { id: $id }) {
    feed {
      id
    }
  }
}

mutation ForgetFeed($id: ID!) {
  forgetFeed(input: { id: $id }) {
    forgotten
    places
  }
}

mutation RenameFeed($id: ID!, $title: String!) {
  renameFeed(input: { id: $id, title: $title }) {
    feed {
      id
      title
    }
  }
}

mutation SetFeedLifetime($id: ID!, $lasts: String) {
  setFeedLifetime(input: { id: $id, lasts: $lasts }) {
    feed {
      id
      expiresAt
    }
  }
}

mutation NoteFeed($id: ID!, $note: String) {
  noteFeed(input: { id: $id, note: $note }) {
    feed {
      id
      note
    }
  }
}

mutation AskCatalog($question: String!, $feedId: ID, $aboutId: ID) {
  askCatalog(
    input: { question: $question, feedId: $feedId, aboutId: $aboutId }
  ) {
    feed {
      id
      title
    }
    analysis {
      id
      status
      createdAt
    }
  }
}

query Asked($id: ID!) {
  feed(id: $id) {
    id
    title
    connected {
      ...Row
    }
    analyses {
      id
      cause
      question
      drewOn {
        ...Row
      }
      status
      error
      said
      turns
      createdAt
      finishedAt
    }
  }
}
