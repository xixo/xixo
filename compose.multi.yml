x-tenants: &tenants
  XIXO_TENANT: ""
  XIXO_TENANTS: demo,acme
  XIXO_PUBLIC_ORIGIN: http://%{subdomain}.xixo.localhost:${XIXO_PORT:-8180}
  MASKS_ISSUER_TEMPLATE: ${MASKS_ISSUER:-http://%{subdomain}.masks.localhost:12345}

services:
  xixo:
    environment: *tenants

  xixo-vite:
    environment: *tenants

  xixo-worker:
    environment: *tenants

  xixo-link:
    extra_hosts:
      - "demo.xixo.localhost:host-gateway"
      - "demo.masks.localhost:host-gateway"
    environment:
      XIXO_LINK_XIXO: http://demo.xixo.localhost:${XIXO_PORT:-8180}
      XIXO_LINK_ISSUER: http://demo.masks.localhost:12345
      XIXO_LINK_HANDOFF: /handoff/demo
      XIXO_LINK_WRITABLE: /data/files/demo
