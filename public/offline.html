<!doctype html>
<html lang="en">
  <head>
    <title>xixo is offline</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0e0f1e">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: 24px;
        background: #0e0f1e;
        color: #e8e9f7;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }
      main { display: grid; gap: 16px; max-width: 34rem; justify-items: start; }
      img { width: 40px; height: 40px; }
      h1 { font-size: 1.5rem; letter-spacing: -0.02em; }
      p { color: #9497b8; }
      button {
        padding: 8px 18px;
        border: 0;
        border-radius: 999px;
        background: #4a4be2;
        color: #f7f7ff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #3a3bc4; }
      button:focus-visible { outline: 2px solid #a5a6ff; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="">
      <h1>xixo is out of reach</h1>
      <p>This device is offline, or the server xixo runs on is not answering. Everything you keep is still where it lives. xixo opens again once it can reach the server.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload())
    </script>
  </body>
</html>
